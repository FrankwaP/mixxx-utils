# Note: do not use variables such as "~", "$HOME" or "%TMP" in the paths.
# For example, use /home/user/Music instead of $HOME/Music.


# mixxx database location
mixxx_db = "/home/francois/.mixxx/mixxxdb.sqlite"
# clementine database lcoation
clem_db = "/home/francois/.config/Clementine/clementine.db"

# Minimum name similarity score required for a potential track match (0-100).
threshold_name_similarity = 50
# Number of similar track matches to propose.
n_similar_track_proposal = 3
# Changing a track's file can affect its key, gain, and waveform.
# These options defined wether the corresponding data should be deleted.
# (The bitrate is updated automatically by Mixxx).
delete_keys = true
delete_gains = true
delete_waveforms = true

# Confirm that this configuration is OK before continuing.
confirm_config = true
# Confirm that the player library has been refreshed before using it.
confirm_player_refresh = true
# Log level: "debug", "info", "warning", or "error".
logging_level = "info"
