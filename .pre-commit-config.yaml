exclude: python_tools/utils/proto/.*

default_stages:
  - pre-commit

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
-   repo: meta
    hooks:
    -   id: check-hooks-apply
    -   id: check-useless-excludes
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: trailing-whitespace
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: check-merge-conflict
    -   id: no-commit-to-branch
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black
#   I run it locally else I have to define the stubs here AND in the requirements (and I don't like the idea)
# -   repo: https://github.com/pre-commit/mirrors-mypy
#     rev: v1.19.1
#     hooks:
#     -   id: mypy
-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
-   repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.7
    hooks:
    -   id: sqlfluff-lint
        args: [--dialect, sqlite]
-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
    -   id: markdownlint-fix
        files: '.*\.md'
        args: [--disable, MD013]
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
-   repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort
        name: isort (python)
# local runs
- repo: local  # use requirements-pip-mypy.txt
  hooks:
    - id: mypy
      name: mypy
      entry: mypy --check-untyped-defs
      language: system
      types: [python]
      pass_filenames: true
      always_run: false
      stages: [pre-commit]
- repo: local
  hooks:
    - id: pytest
      name: pytest
      entry: python -m pytest
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
