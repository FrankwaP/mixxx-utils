[project]
name = "python-tools"
version = "0.1.0"
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["mixxx", "rekordbox", "export", "tools"]

[tool.mypy]
exclude = '^python_tools/utils/proto/keys_pb2\.py$'
check_untyped_defs = true
show_traceback = true

[tool.pytest.ini_options]
pythonpath = '.'
testpaths = 'tests'
log_cli = true

[tool.isort]
profile = "black"
