[project]
name = "mixxx-utils"
version = "0.1.0"
requires-python = ">=3.11"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["mixxx", "rekordbox", "export", "tools"]
dependencies = [
    "eyed3>=0.9",
    "protobuf",
    "jellyfish",
    "tqdm",
    "pydantic",
    "toml-cli",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "black",
    "isort",
    "flake8",
    "flake8-bugbear",
    "pre-commit",
]
build = ["nuitka[onefile]"]


[tool.mypy]
exclude = '^python_tools/utils/proto/'
check_untyped_defs = true
show_traceback = true

[tool.pytest.ini_options]
pythonpath = '.'
testpaths = 'tests'
log_cli = true

[tool.isort]
profile = "black"
