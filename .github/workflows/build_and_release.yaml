name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r python_tools/requirements-pip-build.txt

      - name: Build mixxx_to_rekordbox with Nuitka
        run: |
          python -m nuitka --standalone --onefile --nofollow-import-to=numpy mixxx_to_rekordbox.py

      - name: Upload mixxx_to_rekordbox binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mixxx_to_rekordbox${{ runner.os == 'Windows' && '.exe' || '.bin' }}

      - name: Build mixxx_to_rekordbox_compare with Nuitka
        run: |
          python -m nuitka --standalone --onefile --nofollow-import-to=numpy mixxx_to_rekordbox_compare.py

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mixxx_to_rekordbox_compare${{ runner.os == 'Windows' && '.exe' || '.bin' }}
