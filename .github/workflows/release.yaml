name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra build

      - name: Build executables with Nuitka
        shell: bash
        run: |
          for script in \
            mixxx_to_rekordbox.py \
            mixxx_to_rekordbox_compare.py \
            snap_cues.py
          do
            python -m nuitka \
              --onefile \
              --nofollow-import-to=numpy \
              --nofollow-import-to=pandas \
              --assume-yes-for-downloads \
              "$script"
          done

      - name: Upload executables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mixxx_to_rekordbox${{ runner.os == 'Windows' && '.exe' || '.bin' }}
            mixxx_to_rekordbox_compare${{ runner.os == 'Windows' && '.exe' || '.bin' }}
            snap_cues${{ runner.os == 'Windows' && '.exe' || '.bin' }}
