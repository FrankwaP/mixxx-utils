# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
   branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_tools/requirements-pip-dev.txt

      - name: Run pre-commit [pre-commit]
        run: pre-commit run --all-files --hook-stage pre-commit

      - name: Run pre-commit [pre-push]
        run: pre-commit run --all-files --hook-stage pre-push
